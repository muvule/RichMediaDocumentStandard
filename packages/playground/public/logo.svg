<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="rmdLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="rmdGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="sheetBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162032" />
      <stop offset="100%" stop-color="#0b1322" />
    </linearGradient>
  </defs>

  <!-- Outer App Shield / Badge -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="#080e1a" stroke="#1e293b" stroke-width="3" />
  
  <!-- Soft Ambient Inner Glow -->
  <rect x="18" y="16" width="64" height="68" rx="12" fill="#10b981" fill-opacity="0.12" />

  <!-- Document Sheet Shape -->
  <path
    d="M 28 18 L 56 18 L 74 36 L 74 78 C 74 81.3 71.3 84 68 84 L 28 84 C 24.7 84 22 81.3 22 78 L 22 24 C 22 20.7 24.7 18 28 18 Z"
    fill="url(#sheetBgGrad)"
    stroke="url(#rmdGlowGrad)"
    stroke-width="3.5"
  />
  <!-- Folded Corner -->
  <path d="M 56 18 L 56 36 L 74 36 Z" fill="#1e293b" stroke="url(#rmdGlowGrad)" stroke-width="3" />

  <!-- Markdown Prose Header Bar -->
  <line x1="30" y1="32" x2="48" y2="32" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" />
  <line x1="30" y1="42" x2="64" y2="42" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />

  <!-- Spatial Bounding Box Reticle Brackets (xywh) -->
  <path d="M 33 57 L 33 50 L 41 50" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 59 50 L 67 50 L 67 57" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 33 67 L 33 74 L 41 74" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 59 74 L 67 74 L 67 67" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Target Focal Point -->
  <circle cx="50" cy="62" r="5" fill="url(#rmdLogoGrad)" />
  <circle cx="50" cy="62" r="2" fill="#ffffff" />
</svg>
