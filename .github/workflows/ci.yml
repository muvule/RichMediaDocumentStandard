name: CI (Test, Lint & Schema Validation)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo packages
        run: npm run build

      - name: Run automated test & schema validation suite
        run: npm test

      - name: Run performance benchmark regression checks
        run: npm run benchmark
