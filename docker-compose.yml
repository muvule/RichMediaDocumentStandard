version: '3.8'

services:
  rmd-cli:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: ["validate", "./examples/image-report.rmd"]

  rmd-playground:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run playground -- --host"
