# Render Blueprint Specification for RMD Playground & Landing Page
services:
  - type: web
    name: rmd-playground
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./packages/playground/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
